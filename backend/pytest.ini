[pytest]
; Đưa thư mục backend/ vào sys.path.
;
; CI gọi ``pytest tests -v``; cách gọi này KHÔNG thêm thư mục hiện hành vào
; sys.path (khác với ``python -m pytest``). Thiếu dòng này, tests/conftest.py
; chết ngay khi import với "ModuleNotFoundError: No module named 'app'", và cả
; job backend không chạy được test nào.
pythonpath = .

; Một event loop duy nhất cho cả fixture lẫn test.
;
; Mặc định pytest-asyncio 1.x tạo event loop mới cho MỖI test function. Với
; SQLite điều đó vô hại vì NullPool không giữ connection. Với PostgreSQL pool
; thật (pool_size=25) connection nằm lại trong pool thuộc loop cũ, nên test kế
; tiếp nhận được connection gắn với loop đã đóng và báo
; "got Future attached to a different loop" — /api/health trả database:error
; dù DB hoàn toàn khoẻ. Ghim loop ở mức session để connection không đổi loop.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
