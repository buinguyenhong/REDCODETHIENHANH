server {
    listen 80;
    server_name localhost;

    # Client body limit for audio uploads
    client_max_body_size 20M;

    # 1. Frontend React static build files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Local audio files direct serving
    # Khai báo tường minh kiểu media: mime.types mặc định của nginx không map .wav,
    # nên tệp còi được trả về dưới dạng application/octet-stream. Trình duyệt có
    # quyền từ chối phát một <audio> không có kiểu media hợp lệ — với hệ thống này
    # nghĩa là trạm hiện báo động trên màn hình mà loa không kêu.
    location /assets/audio/ {
        alias /var/www/assets/audio/;
        types {
            audio/wav wav;
            audio/mpeg mp3;
            audio/ogg ogg oga;
            audio/mp4 m4a;
        }
        default_type audio/wav;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. FastAPI HTTP API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 4. FastAPI WebSocket Gateway
    location /ws {
        access_log off;
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
