name: Redcode CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redcode_ci
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: redcode_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redcode_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEMO_MODE: 'true'
      # Bộ test chạy trên chính PostgreSQL — cùng engine với production. Trước
      # đây CI chạy trên SQLite, nên lỗi chỉ xuất hiện với PostgreSQL pool thật
      # (connection gắn với event loop cũ) không thể lộ ra. Live transport dùng
      # database riêng để không tranh chấp với phần còn lại của suite.
      DATABASE_URL: postgresql+asyncpg://redcode_ci:ci-only-not-production@localhost:5432/redcode_ci
      LIVE_TEST_DATABASE_URL: postgresql+asyncpg://redcode_ci:ci-only-not-production@localhost:5432/redcode_live
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Create live transport database
        env:
          PGPASSWORD: ci-only-not-production
        run: psql -h localhost -U redcode_ci -d redcode_ci -c 'CREATE DATABASE redcode_live'
      - run: alembic upgrade head
      - run: pytest tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t redcode-api:ci .
      - run: docker build -f nginx/Dockerfile -t redcode-nginx:ci .
