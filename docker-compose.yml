version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: redcode_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ENVIRONMENT lấy từ .env (Compose đọc .env cùng thư mục để nội suy), mặc
      # định production khi .env không khai báo. Trước đây giá trị được viết cứng
      # ở đây nên .env không thể ghi đè, và vì `environment` thắng `env_file`, các
      # guard cấu hình production (SECRET_KEY, ALLOWED_ORIGINS, DEMO_MODE) không
      # thể tắt bằng .env dù người triển khai muốn chạy thử cấu hình khác.
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # In production, specify connection to your existing PostgreSQL container:
      # e.g.: postgresql+asyncpg://postgres:yourpassword@postgres_container:5432/redcode
      - DATABASE_URL=${DATABASE_URL:-}
      - SECRET_KEY=${SECRET_KEY}
      - AUDIO_UPLOAD_DIR=/app/static/audio
    volumes:
      - redcode_audio:/app/static/audio
    networks:
      - redcode_net
      # PostgreSQL hiện có của bệnh viện (REDCODE không tạo container PostgreSQL mới):
      # - existing_postgres_network
      #
      # n8n: N8N_WEBHOOK_URL mặc định là http://n8n:5678/webhook/redcode, tức backend
      # phải phân giải được hostname `n8n`. Hostname đó chỉ tồn tại bên trong một
      # Docker network có container/service mang tên `n8n`. Nếu n8n do IT dựng riêng,
      # bật network đó ở đây và khai báo external ở cuối file. Nếu bật N8N_ENABLED=true
      # mà backend không phân giải được `n8n`, mọi thông báo sẽ lỗi DNS, retry rồi cạn
      # lượt (EXHAUSTED) — báo động nội bộ vẫn chạy bình thường.
      # - n8n_network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: redcode_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Mount built frontend assets
      # Mount persisted audio assets for direct streaming
      - redcode_audio:/var/www/assets/audio:ro
    depends_on:
      - backend
    networks:
      - redcode_net

volumes:
  redcode_audio:
    name: redcode_audio_data

networks:
  redcode_net:
    driver: bridge
  # To connect with existing PostgreSQL container on hospital server:
  # existing_postgres_network:
  #   external: true
  #   name: your_existing_postgres_network_name
  # Network chứa n8n, nếu n8n do IT dựng riêng và backend cần gọi
  # http://n8n:5678/webhook/redcode. Điền đúng tên network thật của n8n.
  # n8n_network:
  #   external: true
  #   name: your_existing_n8n_network_name
